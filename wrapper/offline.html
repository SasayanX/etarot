<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無料タロット占い - 毎日の運勢とカード占い - オフライン</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 500px;
        }
        
        h1 {
            color: #bb86fc;
            margin-bottom: 20px;
        }
        
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            width: 100%;
        }
        
        .message {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .button {
            background-color: #bb86fc;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .button:hover {
            background-color: #9966cc;
        }
        
        .tarot-symbol {
            font-size: 60px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tarot-symbol">🔮</div>
        <h1>無料タロット占い - 毎日の運勢とカード占い</h1>
        
        <div class="card">
            <div class="message">
                <p>インターネット接続がありません。</p>
                <p>接続が回復したら、アプリは自動的に再開します。</p>
            </div>
            <button class="button" onclick="location.reload()">再読み込み</button>
        </div>
    </div>
    
    <script>
        // オンラインに戻ったら自動的にリロード
        window.addEventListener('online', () => {
            location.reload();
        });
        
        // 定期的に接続をチェック
        setInterval(() => {
            if (navigator.onLine) {
                location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
