<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無料タロット占い - 毎日の運勢とカード占い</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
        .loaded iframe {
            display: block;
        }
        .loaded #loading {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>無料タロット占い - 毎日の運勢とカード占いを読み込み中...</p>
    </div>
    
    <iframe 
        id="app-frame"
        src="https://your-etarot-domain.com"
        onload="document.body.classList.add('loaded')"
        allow="camera; microphone; geolocation; payment">
    </iframe>

    <script>
        // オフライン検知
        window.addEventListener('offline', () => {
            document.getElementById('loading').innerHTML = 
                '<p>インターネット接続を確認してください</p>';
            document.body.classList.remove('loaded');
        });

        window.addEventListener('online', () => {
            location.reload();
        });

        // エラーハンドリング
        document.getElementById('app-frame').onerror = () => {
            document.getElementById('loading').innerHTML = 
                '<p>アプリの読み込みに失敗しました<br>しばらく後にお試しください</p>';
        };
    </script>
</body>
</html>
